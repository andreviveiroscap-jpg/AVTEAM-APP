<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AV Team – Painel do treinador</title>
<link rel="icon" href="logo.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icone-app-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png?v=2">
<meta name="apple-mobile-web-app-title" content="AV Treinador">
<!-- Ícone na tela de início do iPhone abre em tela cheia, como aplicativo -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

</head><body><div id="app"></div><div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="comum.js"></script>
<script src="exercicios.js"></script>
<script>
// Painel do treinador (login por e-mail e senha).
var DEF = "O(a) aluno(a) deve realizar mobilidade livre antes de todos os treinos.\n**Warm up set:** série de aquecimento, na qual você utilizará 50% da carga de trabalho.\n**Feeder set:** série de reconhecimento, na qual você utilizará aproximadamente 80% da carga de trabalho.\n**Working set:** séries válidas, na qual você utilizará sua carga máxima para as repetições indicadas.\nOs descansos entre as séries devem ser de no mínimo 1:30 min.";
var EXEMPLO = {nome:"Fernando Martins", orientacoes:DEF, treinos:[{dia:"Segunda", nome:"Peito, ombro e tríceps", ex:[
  {nome:"Supino inclinado com halter", grupo:"Peito"}, {nome:"Supino reto com barra", grupo:"Peito"}, {nome:"Crucifixo na máquina", grupo:"Peito"},
  {nome:"Desenvolvimento de ombros", grupo:"Ombro"}, {nome:"Elevação lateral com halter", grupo:"Ombro"},
  {nome:"Tríceps no pulley", grupo:"Tríceps"}, {nome:"Tríceps francês", grupo:"Tríceps"}]}]};
var EDABERTO = null; // exercício aberto no editor ("treino:exercício")
var ALUNOS = [], AL = null, EDIT = null, DIRTY = false, ABA = "hist", EXSEL = null, PER = "12";

function linkAluno(c){ return new URL("index.html#" + c, location.href).href; }
function armed(b, txt){ if (b.dataset.armed) return true; b.dataset.armed = "1"; b.dataset.old = b.textContent; b.textContent = txt; setTimeout(function(){ if (b.isConnected) { delete b.dataset.armed; b.textContent = b.dataset.old; } }, 3000); return false; }
function falha(e, oque){ console.error(e); toast("Não foi possível " + oque + ". Confira a internet e tente de novo."); }
function carregando(t){ app.innerHTML = topBar("Painel do treinador", t) + '<main><p class="vazio">Carregando…</p></main>'; }

// ---------- Login ----------
function viewLogin(msg){
  app.innerHTML = topBar("Painel do treinador", "Entrar") + '<main class="login"><form id="login">' +
    '<label class="fl">E-mail<input id="em" type="email" autocomplete="username" required></label>' +
    '<label class="fl">Senha<input id="pw" type="password" autocomplete="current-password" required></label>' +
    (msg ? '<p class="erro">' + esc(msg) + '</p>' : '') +
    '<div class="acts"><button class="pri" type="submit">Entrar</button></div>' +
    '<button class="lnk" data-act="esqueci" type="button">Esqueci minha senha</button></form></main>';
}
async function esqueci(b){
  var em = $("em").value.trim();
  if (!em) { toast("Digite o seu e-mail no campo acima."); $("em").focus(); return; }
  b.disabled = true;
  var r = await sb.auth.resetPasswordForEmail(em, {redirectTo:location.href.split("#")[0]});
  b.disabled = false;
  toast(r.error ? "Não foi possível enviar. Tente de novo em alguns minutos." : "Se o e-mail estiver cadastrado, chega uma mensagem com o link para criar uma senha nova.");
}
function viewNovaSenha(msg){
  app.innerHTML = topBar("Painel do treinador", "Nova senha") + '<main class="login"><form id="nova">' +
    '<label class="fl">Nova senha (mínimo 8 caracteres)<input id="pw1" type="password" autocomplete="new-password" minlength="8" required></label>' +
    '<label class="fl">Repita a nova senha<input id="pw2" type="password" autocomplete="new-password" minlength="8" required></label>' +
    (msg ? '<p class="erro">' + esc(msg) + '</p>' : '') +
    '<div class="acts"><button class="pri" type="submit">Salvar senha</button></div></form></main>';
}
async function novaSenha(ev){
  ev.preventDefault();
  if ($("pw1").value !== $("pw2").value) { viewNovaSenha("As senhas não são iguais."); return; }
  var r = await sb.auth.updateUser({password:$("pw1").value});
  if (r.error) { viewNovaSenha("Não foi possível salvar. Use uma senha com pelo menos 8 caracteres."); return; }
  history.replaceState(null, "", location.pathname);
  toast("Senha alterada."); lista();
}
async function entrar(ev){
  ev.preventDefault();
  var b = ev.target.querySelector("button"); b.disabled = true; b.textContent = "Entrando…";
  var r = await sb.auth.signInWithPassword({email:$("em").value.trim(), password:$("pw").value});
  if (r.error) { viewLogin(r.error.status === 400 ? "E-mail ou senha incorretos." : "Não foi possível entrar. Confira a internet."); return; }
  lista();
}

// ---------- Lista de alunos ----------
async function lista(){
  AL = null; EDIT = null; DIRTY = false;
  carregando("Meus alunos");
  try { ALUNOS = await rpc("treinador_alunos"); } catch (e) { falha(e, "carregar os alunos"); viewErro(lista); return; }
  app.innerHTML = topBar("Painel do treinador", "Meus alunos") + '<main>' +
    '<div class="cab"><span class="quando">' + ALUNOS.length + ' aluno(s)</span><button class="lnk" data-act="sair" type="button">Sair</button></div>' +
    (ALUNOS.length ? "" : '<div class="aviso"><p>Você ainda não tem alunos cadastrados.</p><button class="lnk" data-act="exemplo" type="button">Criar aluno de exemplo (Fernando Martins)</button></div>') +
    ALUNOS.map(function(a){
      return '<section class="ex"><h2>' + esc(a.nome) + '</h2><p class="quando">' +
        (a.ultimo ? 'Último treino: <strong>' + haQuanto(a.ultimo) + '</strong> (' + dataCurta(a.ultimo) + ') · ' + a.sessoes + ' treino(s)' : 'Ainda não treinou') +
        '</p><div class="acts"><button class="pri" data-act="abrir" data-id="' + a.id + '">Abrir</button><button data-act="copy" data-c="' + esc(a.codigo) + '">Copiar link</button></div></section>';
    }).join("") +
    '<button class="big" data-act="novo">+ Novo aluno</button>' +
    '<label class="fl">Link do aluno<input id="lk" readonly placeholder="Toque em Copiar link"></label></main>';
}
function verComoAluno(url){
  var o = document.createElement("div"); o.className = "previa"; o.id = "previa";
  o.innerHTML = '<div class="previa-top"><span>Visualização do aluno</span><button type="button" id="fechaprevia">✕ Fechar</button></div><iframe title="Tela do aluno" src="' + esc(url) + '"></iframe>';
  document.body.appendChild(o); document.body.classList.add("sem-rolagem");
  $("fechaprevia").addEventListener("click", function(){ o.remove(); document.body.classList.remove("sem-rolagem"); if (AL && AL.id) abrir(AL.id, ABA); });
}
function viewErro(f){
  app.innerHTML = topBar("Painel do treinador", "Sem conexão") + '<main><div class="aviso"><p>Não foi possível carregar. Confira a internet.</p></div><button class="big" data-act="tentar" type="button">Tentar de novo</button></main>';
  viewErro.f = f;
}

// ---------- Aluno ----------
async function abrir(id, aba){
  carregando("Aluno");
  try { AL = await rpc("treinador_aluno", {p_id:id}); } catch (e) { falha(e, "abrir o aluno"); viewErro(function(){ abrir(id, aba); }); return; }
  if (!AL) { lista(); return; }
  EDIT = null; DIRTY = false; ABA = aba || "hist"; EXSEL = null; EDABERTO = null;
  viewAluno(); window.scrollTo(0, 0);
}
function novoAluno(){
  AL = {id:null, nome:"", codigo:null, orientacoes:DEF, treinos:[], sessoes:[]};
  EDIT = {id:null, nome:"", orientacoes:DEF, treinos:[{id:novoId(), dia:"Segunda", nome:"Treino A", ex:[]}]};
  DIRTY = true; ABA = "treino"; viewAluno(); window.scrollTo(0, 0);
}
function viewAluno(){
  var abas = AL.id ? [["hist", "Histórico"], ["evo", "Evolução"], ["vol", "Volume"], ["treino", "Treino"]] : [["treino", "Treino"]];
  app.innerHTML = topBar(AL.id ? "Aluno" : "Novo aluno", esc(AL.nome || "Novo aluno")) + '<main>' +
    '<button class="lnk" data-act="voltar" type="button">← Meus alunos</button>' +
    (AL.codigo ? '<div class="acts"><button data-act="copy" data-c="' + esc(AL.codigo) + '">Copiar link</button><a class="lnkbtn" data-act="vercomo" href="' + esc(linkAluno(AL.codigo)) + '">Ver como aluno</a><button data-act="codigo">Gerar novo link</button></div>' +
      '<label class="fl" hidden id="lkw">Link do aluno<input id="lk" readonly></label>' : '') +
    '<div class="tabs">' + abas.map(function(a){ return '<button type="button" data-aba="' + a[0] + '" aria-pressed="' + (ABA === a[0]) + '">' + a[1] + '</button>'; }).join("") + '</div>' +
    '<div id="conteudo"></div></main>' +
    (ABA === "treino" ? '<div class="bar"><button id="pub" data-act="salvar" type="button"' + (DIRTY ? "" : " disabled") + '>Salvar alterações</button></div>' : '');
  if (ABA === "hist") viewHistorico(); else if (ABA === "evo") viewEvolucao(); else if (ABA === "vol") viewVolume(); else viewEditor();
}

// Junta as séries de uma sessão por exercício, mantendo a ordem.
function porExercicio(s){
  var m = {}, o = [];
  s.series.forEach(function(x){ var k = x.exercicio; if (!m[k]) { m[k] = {nome:k, grupo:x.grupo, series:[]}; o.push(m[k]); } m[k].series.push(x); });
  return o;
}
function serieTxt(x){ return (x.carga != null ? kg(x.carga) : "?") + " × " + (x.repeticoes != null ? x.repeticoes : "?"); }
// Série com o tipo indicado (só aquecimento e reconhecimento ganham etiqueta).
function serieHtml(x){ return (x.tipo && x.tipo !== "trabalho" ? '<span class="tipo t-' + esc(x.tipo) + '">' + (TIPOS_CURTOS[x.tipo] || "") + '</span> ' : '') + serieTxt(x); }

function viewHistorico(){
  var ss = AL.sessoes;
  $("conteudo").innerHTML = ss.length ? '<p class="quando">' + ss.length + ' treino(s) registrado(s). Toque para ver as séries.</p>' + ss.map(function(s){
    return '<details class="sess"><summary><b>' + esc(dataLonga(s.data)) + ' · ' + esc(s.treino_nome) + ((s.notas || []).length ? ' 💬' : '') + '</b><span class="t">' + fmtS(tonSeries(s.series)) + '</span><span>' + haQuanto(s.data) + '</span></summary><ul>' +
      porExercicio(s).map(function(e){
        var n = (s.notas || []).filter(function(x){ return x.exercicio === e.nome; })[0];
        return '<li>' + esc(e.nome) + '<small>' + e.series.map(serieHtml).join(" · ") + ' · volume ' + fmtS(tonSeries(e.series)) + '</small>' + (n ? '<span class="nota-al">💬 ' + esc(n.texto) + '</span>' : '') + '</li>';
      }).join("") +
      '</ul></details>';
  }).join("") : '<p class="vazio">Este aluno ainda não finalizou nenhum treino. Assim que ele tocar em “Finalizar treino”, as cargas aparecem aqui.</p>';
}

// ---------- Evolução de carga ----------
function pontosExercicio(nome){
  var pts = [];
  AL.sessoes.forEach(function(s){
    var xs = s.series.filter(function(x){ return x.exercicio === nome; }); if (!xs.length) return;
    // A maior carga vem das séries de trabalho (se houver).
    var melhor = null, trab = xs.filter(function(x){ return !x.tipo || x.tipo === "trabalho"; });
    (trab.length ? trab : xs).forEach(function(x){ if (x.carga != null && (!melhor || Number(x.carga) > Number(melhor.carga) || (Number(x.carga) === Number(melhor.carga) && (x.repeticoes || 0) > (melhor.repeticoes || 0)))) melhor = x; });
    pts.push({data:s.data, melhor:melhor, vol:tonSeries(xs), series:xs});
  });
  return pts.reverse();
}
function viewEvolucao(){
  var nomes = [];
  AL.sessoes.forEach(function(s){ s.series.forEach(function(x){ if (nomes.indexOf(x.exercicio) < 0) nomes.push(x.exercicio); }); });
  if (!nomes.length) { $("conteudo").innerHTML = '<p class="vazio">Ainda não há treinos registrados para mostrar a evolução.</p>'; return; }
  if (nomes.indexOf(EXSEL) < 0) EXSEL = nomes[0];
  var pts = pontosExercicio(EXSEL), comCarga = pts.filter(function(p){ return p.melhor; });
  $("conteudo").innerHTML = '<label class="sel">Exercício<select id="exsel">' + nomes.map(function(n){ return '<option' + (n === EXSEL ? " selected" : "") + '>' + esc(n) + '</option>'; }).join("") + '</select></label>' +
    '<section class="card"><h2>Maior carga por treino</h2><p class="sub">' + esc(EXSEL) + ' · em kg</p>' +
    (comCarga.length > 1 ? '<div class="grafico" id="graf"></div>' : '<p class="vazio">O gráfico aparece a partir do segundo treino com carga registrada.</p>') +
    '<table class="tab"><thead><tr><th>Data</th><th>Séries</th><th class="num">Volume</th></tr></thead><tbody>' +
    pts.slice().reverse().map(function(p){ return '<tr><td>' + dataCurta(p.data) + '</td><td>' + p.series.map(serieHtml).join(" · ") + '</td><td class="num">' + fmtS(p.vol) + '</td></tr>'; }).join("") +
    '</tbody></table></section>';
  if (comCarga.length > 1) grafico($("graf"), comCarga.map(function(p){ return {t:new Date(p.data).getTime(), y:Number(p.melhor.carga), txt:dataCurta(p.data) + ": " + kg(p.melhor.carga) + " kg × " + (p.melhor.repeticoes != null ? p.melhor.repeticoes : "?")}; }));
}
// Gráfico de linha simples (uma série), com dica ao tocar ou passar o mouse.
function grafico(el, pts){
  var W = 340, H = 190, L = 34, R = 10, T = 22, B = 22;
  var ys = pts.map(function(p){ return p.y; }), lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
  var passo = [1, 2, 2.5, 5, 10, 20, 25, 50, 100].filter(function(s){ return (hi - lo) / s <= 4; })[0] || 100;
  lo = Math.floor(lo / passo) * passo; hi = Math.ceil(hi / passo) * passo; if (hi === lo) { hi += passo; lo = Math.max(0, lo - passo); }
  var t0 = pts[0].t, t1 = pts[pts.length - 1].t; if (t1 === t0) t1 = t0 + 1;
  function X(t){ return L + (t - t0) / (t1 - t0) * (W - L - R); }
  function Y(y){ return T + (hi - y) / (hi - lo) * (H - T - B); }
  var g = "";
  for (var v = lo; v <= hi + 1e-9; v += passo) g += '<line class="grade" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="eixo" x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + kg(v) + '</text>';
  var dts = [pts[0], pts[pts.length - 1]];
  g += dts.map(function(p, i){ return '<text class="eixo" x="' + X(p.t) + '" y="' + (H - 8) + '" text-anchor="' + (i ? "end" : "start") + '">' + new Date(p.t).toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"}) + '</text>'; }).join("");
  var d = pts.map(function(p, i){ return (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.y).toFixed(1); }).join(" ");
  var u = pts[pts.length - 1];
  el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evolução da maior carga por treino">' + g +
    '<path class="linha" d="' + d + '"/>' + pts.map(function(p){ return '<circle class="pt" r="4" cx="' + X(p.t) + '" cy="' + Y(p.y) + '"/>'; }).join("") +
    '<text class="ult" x="' + (X(u.t) - 8) + '" y="' + (Y(u.y) - 9) + '" text-anchor="end">' + kg(u.y) + ' kg</text>' +
    '<line class="mira" id="mira" y1="' + T + '" y2="' + (H - B) + '" visibility="hidden"/></svg><div class="dica" id="dica" hidden></div>';
  var svg = el.querySelector("svg"), mira = el.querySelector("#mira"), dica = el.querySelector("#dica");
  function mostra(ev){
    var r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * W, p = pts[0];
    pts.forEach(function(q){ if (Math.abs(X(q.t) - x) < Math.abs(X(p.t) - x)) p = q; });
    mira.setAttribute("x1", X(p.t)); mira.setAttribute("x2", X(p.t)); mira.setAttribute("visibility", "visible");
    dica.textContent = p.txt; dica.hidden = false;
    var px = X(p.t) / W * r.width, meia = dica.offsetWidth / 2;
    dica.style.left = Math.max(meia, Math.min(r.width - meia, px)) + "px";
    dica.style.top = Math.max(0, Y(p.y) / H * r.height - dica.offsetHeight - 12) + "px";
  }
  svg.addEventListener("pointermove", mostra);
  svg.addEventListener("pointerdown", mostra);
  svg.addEventListener("pointerleave", function(){ mira.setAttribute("visibility", "hidden"); dica.hidden = true; });
}

// ---------- Volume (tonelagem) ----------
function inicioSemana(d){ var x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
function barras(itens){
  var max = Math.max.apply(null, itens.map(function(i){ return i.v; }).concat([1]));
  return '<div class="barras">' + itens.map(function(i){ return '<span class="rot">' + esc(i.rot) + '</span><span class="trilho"><i style="width:' + (i.v / max * 100).toFixed(1) + '%"></i></span><span class="val">' + fmtS(i.v) + '</span>'; }).join("") + '</div>';
}
function viewVolume(){
  if (!AL.sessoes.length) { $("conteudo").innerHTML = '<p class="vazio">Ainda não há treinos registrados.</p>'; return; }
  var limite = PER === "tudo" ? 0 : inicioSemana(new Date()).getTime() - (Number(PER) - 1) * 7 * 864e5;
  var ss = AL.sessoes.filter(function(s){ return new Date(s.data).getTime() >= limite; });
  var sem = {}, grp = {}, ordemG = [];
  ss.forEach(function(s){
    var k = inicioSemana(s.data).getTime(); sem[k] = (sem[k] || 0) + tonSeries(s.series);
    s.series.forEach(function(x){ var g = x.grupo || "Outros"; if (!(g in grp)) { grp[g] = 0; ordemG.push(g); } grp[g] += tonSeries([x]); });
  });
  // Semanas sem treino aparecem zeradas, para a pausa ficar visível.
  var semanas = [];
  if (ss.length) for (var t = inicioSemana(ss[ss.length - 1].data); t <= new Date(); t.setDate(t.getDate() + 7)) semanas.push({rot:"Sem. " + t.toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"}), v:sem[t.getTime()] || 0});
  var total = ss.reduce(function(a, s){ return a + tonSeries(s.series); }, 0);
  $("conteudo").innerHTML = '<div class="per">' + [["4", "4 semanas"], ["12", "12 semanas"], ["tudo", "Tudo"]].map(function(p){ return '<button type="button" data-per="' + p[0] + '" aria-pressed="' + (PER === p[0]) + '">' + p[1] + '</button>'; }).join("") + '</div>' +
    (ss.length ? '<p class="vol">Total no período: ' + fmt(total) + '<small>' + ss.length + ' treino(s)</small></p>' +
      '<section class="card"><h2>Por semana</h2><p class="sub">Semana começando na segunda-feira</p>' + barras(semanas.reverse()) + '</section>' +
      '<section class="card"><h2>Por grupo muscular</h2><p class="sub">Soma do período</p>' + barras(ordemG.map(function(g){ return {rot:g, v:grp[g]}; }).sort(function(a, b){ return b.v - a.v; })) + '</section>' +
      '<section class="card"><h2>Por treino</h2><table class="tab"><thead><tr><th>Data</th><th>Treino</th><th class="num">Tonelagem</th></tr></thead><tbody>' +
      ss.map(function(s){ return '<tr><td>' + dataCurta(s.data) + '</td><td>' + esc(s.treino_nome) + '</td><td class="num">' + fmtS(tonSeries(s.series)) + '</td></tr>'; }).join("") + '</tbody></table></section>'
    : '<p class="vazio">Nenhum treino neste período.</p>');
}

// ---------- Editor de treino ----------
// Séries de um exercício novo: aquecimento, reconhecimento e duas de trabalho.
var SERIES_PADRAO = [{tipo:"aquecimento", reps:"12"}, {tipo:"reconhecimento", reps:"6"}, {tipo:"trabalho", reps:"6–10"}, {tipo:"trabalho", reps:"6–10"}];
var DESCANSOS = [0, 30, 45, 60, 75, 90, 120, 150, 180, 240, 300];
var GRUPOS = ["Peito", "Costas", "Ombro", "Bíceps", "Tríceps", "Antebraço", "Quadríceps", "Posterior", "Glúteo", "Adutor", "Panturrilha", "Abdômen", "Lombar"];
// Busca na biblioteca de exercícios (exercicios.js): ignora acentos e maiúsculas,
// e cada palavra digitada precisa aparecer no nome ou no grupo.
function semAcento(t){ return t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
var BUSCA = (window.BIBLIOTECA || []).map(function(x){ return semAcento(x[0] + " " + x[1]); });
function sugere(v, at){
  var el = $("sug"); if (!el) return;
  var ps = semAcento(v).split(/\s+/).filter(Boolean), r = [];
  if (ps.length) BUSCA.forEach(function(b, k){ if (r.length < 8 && BIBLIOTECA[k][0] !== v && ps.every(function(p){ return b.indexOf(p) >= 0; })) r.push(k); });
  el.innerHTML = r.map(function(k){ return '<button type="button" data-act="sug" data-k="' + k + '"' + at + '><b>' + esc(BIBLIOTECA[k][0]) + '</b><span>' + esc(BIBLIOTECA[k][1]) + '</span></button>'; }).join("");
}
function novasSeries(){ return JSON.parse(JSON.stringify(SERIES_PADRAO)); }
// Acrescenta uma série do tipo pedido na ordem aquecimento → reconhecimento → trabalho.
var ORDEM_TIPO = {aquecimento:0, reconhecimento:1, trabalho:2}, REPS_PADRAO = {aquecimento:"12", reconhecimento:"6", trabalho:"6–10"};
function adicionaSerie(sc, tipo){
  var pos = 0, reps = REPS_PADRAO[tipo];
  sc.forEach(function(c, k){ if (ORDEM_TIPO[c.tipo] <= ORDEM_TIPO[tipo]) pos = k + 1; if (c.tipo === tipo) reps = c.reps; });
  sc.splice(pos, 0, {tipo:tipo, reps:reps});
}
function copiaEdicao(){
  var c = JSON.parse(JSON.stringify({id:AL.id, nome:AL.nome, orientacoes:AL.orientacoes, treinos:AL.treinos}));
  c.treinos.forEach(function(t){ t.ex.forEach(function(e){ e.series_cfg = JSON.parse(JSON.stringify(cfgDe(e))); e.descanso = descansoDe(e); }); });
  return c;
}
function viewEditor(){
  if (!EDIT) EDIT = copiaEdicao();
  var a = EDIT;
  $("conteudo").innerHTML = '<div style="margin-top:14px"></div>' +
    '<label class="fl">Nome do aluno<input data-f="nome" value="' + esc(a.nome) + '" placeholder="Nome e sobrenome"></label>' +
    '<label class="fl">Orientações do treino: o aluno vê este texto. Escreva o que quiser, uma orientação por linha (**palavra** fica em negrito).<textarea data-f="orient" rows="9">' + esc(a.orientacoes) + '</textarea></label>' +
    '<datalist id="grupos">' + GRUPOS.map(function(g){ return '<option value="' + g + '">'; }).join("") + '</datalist>' +
    a.treinos.map(function(t, ti){
      return '<section class="tred"><div class="tred-h"><label class="fl">Dia<input class="f" data-f="dia" data-ti="' + ti + '" value="' + esc(t.dia) + '"></label><label class="fl">Nome do treino<input class="f" data-f="tn" data-ti="' + ti + '" value="' + esc(t.nome) + '"></label></div>' +
        t.ex.map(function(e, ei){
          var at = ' data-ti="' + ti + '" data-ei="' + ei + '"', chave = ti + ":" + ei;
          if (EDABERTO !== chave) {
            return '<button type="button" class="exed fechado" data-act="editex"' + at + '><span class="exnum">' + (ei + 1) + '</span>' +
              '<span class="exres"><b>' + (esc(e.nome) || '<i>Sem nome</i>') + '</b><span>' + (e.grupo ? esc(e.grupo) + ' · ' : '') + esc(resumoSeries(e.series_cfg)) + (descansoDe(e) ? ' · ⏱\u00a0' + fmtTempo(descansoDe(e)) : '') + '</span></span><span class="seta">✎</span></button>';
          }
          return '<div class="exed aberto"><div class="exed-top"><span class="exnum">' + (ei + 1) + '</span>' +
            '<input class="f nm" placeholder="Digite para buscar o exercício" autocomplete="off" data-f="en"' + at + ' value="' + esc(e.nome) + '"></div>' +
            '<div class="sugest" id="sug"></div>' +
            '<div class="exed-sub"><input class="f grupo" list="grupos" placeholder="Grupo muscular" data-f="eg"' + at + ' value="' + esc(e.grupo) + '">' +
            '<span class="mov"><button type="button" data-act="sobe"' + at + ' aria-label="Subir exercício"' + (ei ? '' : ' disabled') + '>↑</button><button type="button" data-act="desce"' + at + ' aria-label="Descer exercício"' + (ei < t.ex.length - 1 ? '' : ' disabled') + '>↓</button><button type="button" class="dan" data-act="dele"' + at + ' aria-label="Remover exercício">✕</button></span></div>' +
            '<div class="sets-ed"><div class="set-cab"><span></span><span>Tipo da série</span><span>Reps</span><span></span></div>' +
            e.series_cfg.map(function(c, si){
              var as = at + ' data-si="' + si + '"';
              return '<div class="set-ed t-' + c.tipo + '"><span class="sn">' + (si + 1) + '</span>' +
                '<select data-f="st"' + as + ' aria-label="Tipo da série ' + (si + 1) + '">' + Object.keys(TIPOS).map(function(k){ return '<option value="' + k + '"' + (k === c.tipo ? ' selected' : '') + '>' + TIPOS[k] + '</option>'; }).join("") + '</select>' +
                '<input data-f="sr"' + as + ' aria-label="Repetições da série ' + (si + 1) + '" placeholder="Reps" value="' + esc(c.reps) + '">' +
                '<button type="button" class="dels" data-act="dels"' + as + ' aria-label="Apagar série ' + (si + 1) + '"' + (e.series_cfg.length > 1 ? '' : ' disabled') + '>✕</button></div>';
            }).join("") +
            (e.series_cfg.length < 10 ? '<div class="addtipos">' + Object.keys(TIPOS).map(function(k){ return '<button type="button" class="t-' + k + '" data-act="adds" data-tipo="' + k + '"' + at + '>+ <span class="tipo t-' + k + '">' + TIPOS[k] + '</span></button>'; }).join("") + '</div>' : '') +
            '</div><label class="desc-ed">Descanso entre séries<select data-f="ed"' + at + '>' + DESCANSOS.map(function(d){ return '<option value="' + d + '"' + (d === descansoDe(e) ? ' selected' : '') + '>' + (d ? fmtTempo(d) : 'Sem cronômetro') + '</option>'; }).join("") + '</select></label>' +
            '<button type="button" class="lnk pronto" data-act="fechaex">Pronto ✓</button></div>';
        }).join("") +
        '<div class="acts"><button data-act="adde" data-ti="' + ti + '">+ Exercício</button><button class="dan" data-act="delt" data-ti="' + ti + '">Remover treino</button></div></section>';
    }).join("") +
    '<button class="big" data-act="addt">+ Treino</button>' +
    // Segundo botão de salvar no fim da página: barras de outros sites
    // (como a do Netlify) podem cobrir o botão fixo lá embaixo.
    '<div class="acts"><button class="pri" data-act="salvar" type="button">Salvar alterações</button></div>' +
    (a.id ? '<div class="acts"><button class="dan" data-act="dela">Excluir aluno</button></div><p class="quando">Excluir apaga o aluno e todo o histórico de treinos dele.</p>' : '');
}
function sujo(){ DIRTY = true; var p = $("pub"); if (p) p.disabled = false; }
function redraw(){ var y = window.scrollY; sujo(); viewEditor(); window.scrollTo(0, y); }
// Resumo no formato antigo (número de séries e reps), para o caso de o
// banco ainda não ter sido atualizado com os tipos de série.
function resumoAntigo(p){
  p.treinos.forEach(function(t){ t.ex.forEach(function(e){
    var tr = e.series_cfg.filter(function(c){ return c.tipo === "trabalho"; })[0];
    e.series = e.series_cfg.length; e.repeticoes = (tr || e.series_cfg[0]).reps;
  }); });
}
async function salvar(b){
  var p = JSON.parse(JSON.stringify(EDIT));
  if (!p.nome.trim()) { toast("Preencha o nome do aluno."); return; }
  p.treinos.forEach(function(t){ t.ex = t.ex.filter(function(e){ return e.nome.trim(); }); });
  resumoAntigo(p);
  b.disabled = true; b.textContent = "Salvando…";
  try {
    var id = await rpc("treinador_salvar_aluno", {p:p});
    var era = AL.id;
    await abrir(id, "treino");
    toast(era ? "Alterações salvas. O aluno já vê o treino novo." : "Aluno criado. Toque em “Copiar link” para enviar a ele.");
  } catch (e) { b.disabled = false; b.textContent = "Salvar alterações"; falha(e, "salvar"); }
}
async function criarExemplo(){
  var p = JSON.parse(JSON.stringify(EXEMPLO));
  p.treinos.forEach(function(t){ t.id = novoId(); t.ex.forEach(function(e){ e.id = novoId(); e.series_cfg = novasSeries(); }); });
  resumoAntigo(p);
  try { var id = await rpc("treinador_salvar_aluno", {p:p}); abrir(id, "treino"); } catch (e) { falha(e, "criar o aluno de exemplo"); }
}

app.addEventListener("submit", function(ev){ if (ev.target.id === "login") entrar(ev); else if (ev.target.id === "nova") novaSenha(ev); });
app.addEventListener("change", function(ev){ if (ev.target.id === "exsel") { EXSEL = ev.target.value; viewEvolucao(); } });
app.addEventListener("input", function(ev){
  var t = ev.target, f = t.dataset.f; if (!f || !EDIT) return;
  var T = EDIT.treinos[+t.dataset.ti], E = T && T.ex[+t.dataset.ei], S = E && E.series_cfg[+t.dataset.si], v = t.value;
  if (f === "nome") EDIT.nome = v; else if (f === "orient") EDIT.orientacoes = v;
  else if (f === "dia") T.dia = v; else if (f === "tn") T.nome = v;
  else if (f === "en") { E.nome = v; sugere(v, ' data-ti="' + t.dataset.ti + '" data-ei="' + t.dataset.ei + '"'); }
  else if (f === "eg") E.grupo = v;
  else if (f === "sr") S.reps = v;
  else if (f === "ed") E.descanso = Number(v);
  else if (f === "st") { S.tipo = v; t.closest(".set-ed").className = "set-ed t-" + v; }
  sujo();
});
app.addEventListener("click", async function(ev){
  // "Ver como aluno" abre a tela do aluno por cima do painel, sem trocar de
  // página: no app em tela cheia do iPhone, trocar de página mostra a barra do Safari.
  var vc = ev.target.closest("[data-act=vercomo]");
  if (vc) { ev.preventDefault(); verComoAluno(vc.href); return; }
  var b = ev.target.closest("button"); if (!b) return;
  var a = b.dataset.act, ti = +b.dataset.ti, ei = +b.dataset.ei;
  if (b.dataset.aba) { ABA = b.dataset.aba; viewAluno(); return; }
  if (b.dataset.per) { PER = b.dataset.per; viewVolume(); return; }
  if (!a) return;
  if (a === "esqueci") esqueci(b);
  else if (a === "sair") { await sb.auth.signOut(); viewLogin(); }
  else if (a === "tentar") viewErro.f();
  else if (a === "abrir") abrir(b.dataset.id);
  else if (a === "novo") novoAluno();
  else if (a === "exemplo") { b.disabled = true; criarExemplo(); }
  else if (a === "voltar") { if (!DIRTY || armed(b, "Há alterações não salvas. Toque de novo para sair.")) lista(); }
  else if (a === "copy") { var w = $("lkw"); if (w) w.hidden = false; copiar(linkAluno(b.dataset.c), $("lk"), "Link copiado. Envie ao aluno pelo WhatsApp."); }
  else if (a === "codigo") {
    if (!armed(b, "O link atual vai parar de funcionar. Toque de novo.")) return;
    try { var c = await rpc("novo_codigo", {p_aluno:AL.id}); AL.codigo = c; viewAluno(); toast("Novo link gerado. Envie o link novo ao aluno."); }
    catch (e) { falha(e, "gerar o novo link"); }
  }
  else if (a === "salvar") salvar(b);
  else if (a === "adde") { var nx = EDIT.treinos[ti].ex; nx.push({id:novoId(), nome:"", grupo:"", series_cfg:novasSeries(), descanso:90}); EDABERTO = ti + ":" + (nx.length - 1); redraw(); var ni = document.querySelector(".exed.aberto .nm"); if (ni) ni.focus(); }
  else if (a === "sug") { var se = EDIT.treinos[ti].ex[ei], bx = BIBLIOTECA[+b.dataset.k]; se.nome = bx[0]; se.grupo = bx[1]; redraw(); }
  else if (a === "adds") { adicionaSerie(EDIT.treinos[ti].ex[ei].series_cfg, b.dataset.tipo); redraw(); }
  else if (a === "editex") { EDABERTO = ti + ":" + ei; redraw(); }
  else if (a === "fechaex") { EDABERTO = null; viewEditor(); }
  else if (a === "dels") { EDIT.treinos[ti].ex[ei].series_cfg.splice(+b.dataset.si, 1); redraw(); }
  else if (a === "sobe" || a === "desce") { var lx = EDIT.treinos[ti].ex, nj = ei + (a === "sobe" ? -1 : 1); lx.splice(nj, 0, lx.splice(ei, 1)[0]); EDABERTO = ti + ":" + nj; redraw(); }
  else if (a === "dele") { EDIT.treinos[ti].ex.splice(ei, 1); EDABERTO = null; redraw(); }
  else if (a === "addt") { EDIT.treinos.push({id:novoId(), dia:"Dia", nome:"Novo treino", ex:[]}); redraw(); }
  else if (a === "delt") { if (armed(b, "Toque de novo para remover")) { EDIT.treinos.splice(ti, 1); redraw(); } }
  else if (a === "dela") {
    if (!armed(b, "Apaga tudo deste aluno. Toque de novo.")) return;
    try { await rpc("treinador_excluir_aluno", {p_id:AL.id}); DIRTY = false; toast("Aluno excluído."); lista(); }
    catch (e) { falha(e, "excluir o aluno"); }
  }
});
window.addEventListener("beforeunload", function(ev){ if (DIRTY) { ev.preventDefault(); ev.returnValue = ""; } });

async function iniciar(){
  if (!sb) { semConfig(); return; }
  // Link de "Esqueci minha senha" recebido por e-mail.
  var recuperando = /type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange(function(evento){
    if (evento === "PASSWORD_RECOVERY") { recuperando = true; viewNovaSenha(); }
    else if (evento === "SIGNED_OUT") viewLogin();
  });
  var r = await sb.auth.getSession();
  if (recuperando && r.data && r.data.session) viewNovaSenha();
  else if (r.data && r.data.session) lista(); else viewLogin();
}
iniciar();
</script></body></html>
