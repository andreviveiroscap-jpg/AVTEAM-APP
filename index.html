<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AV Team – Treinos</title>
<link rel="icon" href="logo.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icone-app-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png?v=2">
<meta name="apple-mobile-web-app-title" content="AV Team">
<meta name="theme-color" content="#2f0f5a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=7">
</head><body><div id="app"></div><div class="toast" id="toast" hidden></div>
<div class="timer" id="timer" hidden role="timer" aria-live="polite">
  <div class="tm-txt"><span class="tm-rot" id="tmrot">Descanso</span><span class="tm-num" id="tmnum">1:30</span></div>
  <div class="tm-bar"><i id="tmbar"></i></div>
  <div class="tm-acts"><button type="button" data-tm="-15">−15s</button><button type="button" data-tm="15">+15s</button><button type="button" data-tm="pular" id="tmpular">Pular</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script src="config.js?v=7"></script>
<script>var AV_ALUNO = true;</script>
<script src="comum.js?v=7"></script>
<script>
// Tela do aluno. Acesso pelo link com o código: .../#CODIGO
var CODE = "", DADOS = null, W = null, CUR = {}, PEND = [], ENVIANDO = false, OFFLINE = false;
// Exercício aberto (um de cada vez). null: abre sozinho o primeiro não concluído.
var ABERTO = null;

function kDados(){ return "av-dados-" + CODE; }
function kCur(){ return "av-cur-" + CODE; }
function kPend(){ return "av-pend-" + CODE; }
function salvaRascunho(){ guarda(kCur(), CUR); }

function sets(e){
  var t = CUR[W.id] = CUR[W.id] || {}, c = t[e.id] = t[e.id] || [], n = cfgDe(e).length;
  for (var j = 0; j < n; j++) if (!c[j]) c[j] = {kg:"", reps:"", done:false};
  return c.slice(0, n);
}
function notas(){ var t = CUR[W.id] = CUR[W.id] || {}; return t.__notas = t.__notas || {}; }
function comoSeries(e){ return sets(e).map(function(x){ return {carga:x.kg, repeticoes:x.reps}; }); }
function grpTxt(){
  var g = {}, o = [];
  W.ex.forEach(function(e){ var k = e.grupo || "Outros"; if (!(k in g)) { g[k] = 0; o.push(k); } g[k] += tonSeries(comoSeries(e)); });
  return o.map(function(k){ return k + " " + fmtS(g[k]); });
}
function prevTxt(e, j){
  var l = DADOS.ultima[e.id] || [], p = l.filter(function(x){ return x.numero === j + 1; })[0];
  if (!p || (p.carga == null && p.repeticoes == null)) return "";
  return (p.carga != null ? kg(p.carga) + " kg" : "?") + " × " + (p.repeticoes != null ? p.repeticoes : "?");
}

// Treinos ainda não enviados contam como "última vez" até chegarem ao banco.
function aplicaPendentes(d){
  PEND.forEach(function(p){
    var por = {};
    p.series.forEach(function(s){ if (s.numero) (por[s.exercicio_id] = por[s.exercicio_id] || []).push(s); });
    Object.keys(por).forEach(function(id){ d.ultima[id] = por[id]; });
    d.anterior[p.treino] = {data:p.data, tonelagem:tonSeries(p.series)};
  });
  return d;
}

async function carregar(){
  if (!DADOS) app.innerHTML = topBar("AV Team", "Carregando…") + '<main><p class="vazio">Carregando o seu treino…</p></main>';
  try {
    var d = await rpc("aluno_dados", {p_codigo:CODE});
    if (!d) { linkInvalido(); return; }
    guarda(kDados(), d); OFFLINE = false; DADOS = aplicaPendentes(d);
  } catch (e) {
    var c = pega(kDados());
    if (!c) { semInternet(); return; }
    OFFLINE = true; DADOS = aplicaPendentes(c);
  }
  viewAluno();
}
function linkInvalido(){
  app.innerHTML = topBar("AV Team", "Link inválido") + '<main><div class="aviso"><p>Este link não está mais ativo.</p><p>Peça o link atualizado ao seu treinador.</p></div></main>';
}
function semInternet(){
  app.innerHTML = topBar("AV Team", "Sem conexão") + '<main><div class="aviso"><p>Não foi possível carregar o seu treino. Confira a internet e tente de novo.</p></div><button class="big" data-act="recarregar" type="button">Tentar de novo</button></main>';
}
function viewBloqueio(){
  app.innerHTML = topBar("AV Team", "Treinos") + '<main><p>Abra o link que o seu treinador enviou para ver o seu treino.</p><a class="lnk" href="treinador.html">Sou o treinador</a></main>';
}

function viewAluno(){
  var ws = DADOS.treinos;
  W = (W && ws.filter(function(w){ return w.id === W.id; })[0]) || ws[0] || null;
  var lines = (DADOS.orientacoes || "").split("\n").filter(function(l){ return l.trim(); });
  app.innerHTML = topBar("Aluno: " + esc(DADOS.nome), W ? esc(W.dia + ": " + W.nome) : "Sem treino") + '<main>' +
    (OFFLINE ? '<div class="aviso"><p>Sem internet: mostrando o último treino salvo neste celular.</p></div>' : '') +
    '<div id="pendente"></div>' +
    '<div class="tabs"' + (ws.length < 2 ? " hidden" : "") + '>' + ws.map(function(w){ return '<button type="button" data-w="' + w.id + '" aria-pressed="' + (w === W) + '">' + esc(w.dia) + '</button>'; }).join("") + '</div>' +
    (W && W.ex.length ? '<button class="resbtn" type="button" data-act="resumo">📋 Resumo do treino (para foto)</button>' : '') +
    (lines.length ? '<details class="info"><summary>Orientações do treino</summary><ul>' + lines.map(function(l){ return "<li>" + esc(l).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>") + "</li>"; }).join("") + "</ul></details>" : "") +
    '<div class="prog"><i id="pb"></i></div><p class="progt" id="pt"></p><p class="vol" id="vol"></p><div class="grp" id="grp"></div><div id="lista"></div></main>' +
    '<div class="bar"><button id="fin" type="button">Finalizar treino</button></div>';
  renderPendente();
  renderLista();
}
function renderPendente(){
  var el = $("pendente"); if (!el) return;
  el.innerHTML = PEND.length ? '<div class="aviso pend"><p>' + (PEND.length === 1 ? "1 treino aguardando envio" : PEND.length + " treinos aguardando envio") + ' (sem internet na hora de finalizar). Ele será enviado automaticamente.</p><button class="lnk" data-act="enviar" type="button">Tentar enviar agora</button></div>' : "";
}
// ---------- Resumo do treino numa tabela só (para tirar foto) ----------
// Maior carga das séries de trabalho da última vez.
function ultimaCarga(e){
  var cfg = cfgDe(e), m = null;
  (DADOS.ultima[e.id] || []).forEach(function(x){
    var c = cfg[x.numero - 1]; if (c && c.tipo !== "trabalho") return;
    if (x.carga != null && (m == null || Number(x.carga) > m)) m = Number(x.carga);
  });
  return m == null ? "–" : kg(m) + " kg";
}
function mostraResumo(){
  var o = document.createElement("div"); o.className = "folha"; o.id = "folha";
  o.innerHTML = '<div class="folha-top"><span>Resumo do treino</span><button type="button" id="fechafolha">✕ Fechar</button></div>' +
    '<div class="folha-corpo"><h2>' + esc(W.dia + ": " + W.nome) + '</h2><p class="folha-al">' + esc(DADOS.nome) + '</p>' +
    '<table class="tfolha"><thead><tr><th>#</th><th>Exercício</th><th>Séries × reps</th><th class="num">Desc.</th><th class="num">Últ. carga</th></tr></thead><tbody>' +
    W.ex.map(function(e, i){
      return '<tr><td class="n">' + (i + 1) + '</td><td><b>' + esc(e.nome) + '</b>' + (e.grupo ? '<small>' + esc(e.grupo) + '</small>' : '') + (e.obs ? '<small class="obs-f">📝 ' + esc(e.obs) + '</small>' : '') + '</td>' +
        '<td>' + esc(resumoSeries(cfgDe(e))) + '</td><td class="num">' + (descansoDe(e) ? fmtTempo(descansoDe(e)) : '–') + '</td><td class="num">' + ultimaCarga(e) + '</td></tr>';
    }).join("") + '</tbody></table>' +
    '<p class="folha-leg">Aquec. = aquecimento · Reconh. = reconhecimento · Trab. = série de trabalho</p></div>';
  document.body.appendChild(o); document.body.classList.add("sem-rolagem");
  $("fechafolha").addEventListener("click", function(){ o.remove(); document.body.classList.remove("sem-rolagem"); });
}
function concluido(e){ return sets(e).every(function(x){ return x.done; }); }
function proximo(i){
  var n = W.ex.length;
  for (var k = 1; k <= n; k++) { var m = (i + k) % n; if (!concluido(W.ex[m])) return m; }
  return -1;
}
function renderLista(){
  if (!W) { $("lista").innerHTML = '<p class="meta">O treinador ainda não montou o seu treino.</p>'; $("fin").disabled = true; return; }
  if (ABERTO === null) ABERTO = W.ex.length ? (concluido(W.ex[0]) ? proximo(0) : 0) : -1;
  $("lista").innerHTML = W.ex.length ? W.ex.map(function(e, i){
    var cfg = cfgDe(e), aberto = i === ABERTO, feito = concluido(e);
    var nota = notas()[e.id] || "";
    var h = '<section class="ex acc' + (aberto ? " aberto" : "") + (feito ? " feito" : "") + '" id="ex' + i + '">' +
      '<button class="exh" type="button" data-abre="' + i + '" aria-expanded="' + aberto + '"><span class="exst" id="es' + i + '"></span>' +
      '<span class="exn"><h2>' + esc(e.nome) + '</h2>' +
      '<span class="meta">' + esc(resumoSeries(cfg)) + '</span>' +
      '<span class="meta">' + (e.grupo ? esc(e.grupo) + ' · ' : '') + (descansoDe(e) ? '⏱ ' + fmtTempo(descansoDe(e)) + ' · ' : '') + 'volume: <span id="ev' + i + '"></span>' + (nota ? ' · 💬 observação' : '') + '</span></span>' +
      '<span class="seta" aria-hidden="true">' + (aberto ? "▾" : "▸") + '</span></button>';
    if (!aberto) return h + '</section>';
    return h + (e.obs ? '<p class="obs-tr">📝 ' + esc(e.obs) + '</p>' : '') + '<div class="row s h"><span>Série</span><span>Carga (kg)</span><span>Reps</span><span></span></div>' +
      sets(e).map(function(x, j){
        var c = cfg[j] || {}, prev = prevTxt(e, j);
        return '<div class="row s t-' + (TIPOS[c.tipo] ? c.tipo : "trabalho") + (x.done ? " done" : "") + '" data-i="' + i + '" data-j="' + j + '">' +
          '<span class="sinfo">' + tipoChip(c.tipo) + (c.reps ? '<span class="alvo">' + esc(c.reps) + ' reps</span>' : '') +
          '<span class="prev">Última: ' + (prev || "–") + '</span></span>' +
          '<input class="kg" inputmode="decimal" aria-label="Carga em kg, série ' + (j + 1) + '" value="' + esc(x.kg) + '">' +
          '<input class="rp" inputmode="numeric" aria-label="Repetições, série ' + (j + 1) + '" placeholder="' + esc(c.reps || "") + '" value="' + esc(x.reps) + '">' +
          '<button class="chk" type="button" aria-label="Concluir série ' + (j + 1) + '">✓</button></div>';
      }).join("") +
      '<label class="obs">Observação (opcional)<textarea class="nota" data-e="' + e.id + '" rows="2" maxlength="500" placeholder="Como foi? Dor, ajuste do aparelho, carga…">' + esc(nota) + '</textarea></label>' +
      '<button class="sm conc" type="button" data-act="concluir" data-i="' + i + '">Concluir exercício</button></section>';
  }).join("") : '<p class="meta">Este treino ainda não tem exercícios.</p>';
  progress();
}
// Abre um exercício (fechando os outros) e rola até ele.
function abre(i){
  ABERTO = i; renderLista();
  var el = $("ex" + i); if (!el) return;
  var calmo = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({behavior:calmo ? "auto" : "smooth", block:"start"});
}
// ---------- Cronômetro de descanso ----------
// Guarda a hora de término (e não um contador), para continuar certo mesmo
// se o celular deixar a página "dormindo" por alguns segundos.
var TM = {fim:0, total:0, h:null, som:null};
function iniciaDescanso(seg){
  if (!seg) return;
  preparaSom();
  TM.total = seg; TM.fim = Date.now() + seg * 1000;
  $("timer").hidden = false; $("timer").classList.remove("fim"); document.body.classList.add("com-timer");
  $("tmpular").textContent = "Pular";
  clearInterval(TM.h); TM.h = setInterval(tique, 250); tique();
}
function tique(){
  var resta = Math.max(0, Math.ceil((TM.fim - Date.now()) / 1000));
  $("tmrot").textContent = "Descanso"; $("tmnum").textContent = fmtTempo(resta);
  $("tmbar").style.width = (TM.total ? resta / TM.total * 100 : 0) + "%";
  if (resta > 0) return;
  clearInterval(TM.h); TM.h = null;
  $("timer").classList.add("fim"); $("tmpular").textContent = "Fechar"; $("tmrot").textContent = "Descanso concluído"; $("tmnum").textContent = "Próxima série!";
  bipe(); try { navigator.vibrate && navigator.vibrate([250, 120, 250]); } catch (e) {}
  setTimeout(function(){ if (!TM.h) paraDescanso(); }, 4000);
}
function paraDescanso(){ clearInterval(TM.h); TM.h = null; $("timer").hidden = true; document.body.classList.remove("com-timer"); }
// O som só pode ser liberado num toque do aluno (regra dos navegadores).
function preparaSom(){
  try { if (!TM.som) TM.som = new (window.AudioContext || window.webkitAudioContext)(); if (TM.som.state === "suspended") TM.som.resume(); } catch (e) {}
}
function bipe(){
  var c = TM.som; if (!c) return;
  try {
    [0, 0.3, 0.6].forEach(function(t){
      var o = c.createOscillator(), g = c.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(0.25, c.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t + 0.22);
      o.start(c.currentTime + t); o.stop(c.currentTime + t + 0.25);
    });
  } catch (e) {}
}
$("timer").addEventListener("click", function(ev){
  var b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.tm === "pular") { paraDescanso(); return; }
  if (!TM.h) return;
  TM.fim = Math.max(Date.now() + 1000, TM.fim + Number(b.dataset.tm) * 1000);
  TM.total = Math.max(TM.total, Math.ceil((TM.fim - Date.now()) / 1000)); tique();
});

// Quando todas as séries de um exercício são marcadas, ele fecha e o próximo abre.
function aposMarcar(i){
  if (!concluido(W.ex[i])) return;
  setTimeout(function(){ if (ABERTO === i) abre(proximo(i)); }, 450);
}
function progress(){
  var t = 0, d = 0, cur = [], ant = DADOS.anterior[W.id];
  W.ex.forEach(function(e){ sets(e).forEach(function(x){ t++; if (x.done) d++; }); cur = cur.concat(comoSeries(e)); });
  $("pb").style.width = (t ? d / t * 100 : 0) + "%";
  $("pt").textContent = d + " de " + t + " séries concluídas";
  $("vol").innerHTML = "Volume total: " + fmt(tonSeries(cur)) + (ant ? "<small>Treino anterior (" + esc(dataCurta(ant.data)) + "): " + fmt(Number(ant.tonelagem)) + "</small>" : "");
  W.ex.forEach(function(e, i){
    $("ev" + i).textContent = fmtS(tonSeries(comoSeries(e)));
    var s = sets(e), f = s.filter(function(x){ return x.done; }).length;
    var el = $("es" + i); el.textContent = f === s.length ? "✓" : String(i + 1); el.classList.toggle("ok", f === s.length);
    el.setAttribute("aria-label", f + " de " + s.length + " séries feitas");
  });
  $("grp").innerHTML = grpTxt().map(function(s){ return "<span>" + esc(s) + "</span>"; }).join("");
}

function finalizar(){
  var series = [];
  W.ex.forEach(function(e){
    sets(e).forEach(function(x, j){
      var c = num(x.kg), r = parseInt(x.reps, 10);
      if (c == null && isNaN(r)) return;
      series.push({exercicio_id:e.id, numero:j + 1, carga:c, repeticoes:isNaN(r) ? null : r});
    });
    var n = (notas()[e.id] || "").trim();
    if (n) series.push({exercicio_id:e.id, nota:n});
  });
  if (!series.some(function(s){ return s.numero; })) { toast("Preencha a carga ou as repetições de pelo menos uma série."); return; }
  PEND.push({id:novoId(), treino:W.id, data:new Date().toISOString(), series:series});
  guarda(kPend(), PEND);
  aplicaPendentes(DADOS);
  delete CUR[W.id]; salvaRascunho(); ABERTO = null; paraDescanso();
  viewAluno(); window.scrollTo(0, 0);
  enviarPendentes(true);
}
async function enviarPendentes(avisar){
  if (ENVIANDO || !PEND.length) return;
  ENVIANDO = true;
  var enviou = 0, perdeu = 0, falhou = false;
  for (var p of PEND.slice()) {
    try {
      await rpc("aluno_finalizar", {p_codigo:CODE, p_id:p.id, p_treino:p.treino, p_data:p.data, p_series:p.series});
      enviou++;
    } catch (e) {
      // Link desativado ou treino removido pelo treinador: não há como gravar.
      if (e && (e.code === "28000" || e.code === "22023")) perdeu++;
      else { falhou = true; break; }
    }
    PEND = PEND.filter(function(x){ return x.id !== p.id; });
    guarda(kPend(), PEND);
  }
  ENVIANDO = false;
  renderPendente();
  if (perdeu) toast("Um treino não pôde ser gravado porque o treino ou o link foi alterado pelo treinador.");
  else if (falhou && avisar) toast("Sem internet agora. O treino ficou guardado neste celular e será enviado automaticamente.");
  else if (enviou) toast("Treino salvo! O treinador já pode ver suas cargas.");
  if (enviou) carregar();
}

app.addEventListener("input", function(ev){
  var t = ev.target;
  if (t.classList.contains("nota") && W) { notas()[t.dataset.e] = t.value; salvaRascunho(); return; }
  var r = t.closest(".row"); if (!r || !W) return;
  var x = sets(W.ex[+r.dataset.i])[+r.dataset.j];
  if (t.classList.contains("kg")) x.kg = t.value.replace(",", "."); else if (t.classList.contains("rp")) x.reps = t.value;
  salvaRascunho(); progress();
});
app.addEventListener("click", function(ev){
  var b = ev.target.closest("button"); if (!b) return;
  var a = b.dataset.act;
  if (b.classList.contains("chk")) { var r = b.closest(".row"), x = sets(W.ex[+r.dataset.i])[+r.dataset.j]; x.done = !x.done; r.classList.toggle("done", x.done); salvaRascunho(); progress();
    if (x.done) { var ei = +r.dataset.i; if (proximo(ei) >= 0 || !concluido(W.ex[ei])) iniciaDescanso(descansoDe(W.ex[ei])); aposMarcar(ei); }
    return; }
  if (b.dataset.abre) { var k = +b.dataset.abre; if (k === ABERTO) { ABERTO = -1; renderLista(); } else abre(k); return; }
  if (b.dataset.w) { W = DADOS.treinos.filter(function(w){ return w.id === b.dataset.w; })[0]; ABERTO = null; viewAluno(); return; }
  if (b.id === "fin" && W) { finalizar(); return; }
  if (a === "resumo") { mostraResumo(); return; }
  if (a === "concluir") { var ci = +b.dataset.i; sets(W.ex[ci]).forEach(function(x){ x.done = true; }); salvaRascunho(); abre(proximo(ci)); return; }
  if (a === "enviar") enviarPendentes(true);
  else if (a === "recarregar") carregar();
});
window.addEventListener("online", function(){ enviarPendentes(false); });

function iniciar(){
  CODE = location.hash.replace("#", "").trim();
  DADOS = null; W = null; ABERTO = null;
  if (!CODE) { viewBloqueio(); return; }
  if (!sb) { semConfig(); return; }
  CUR = pega(kCur()) || {}; PEND = pega(kPend()) || [];
  carregar().then(function(){ enviarPendentes(false); });
}
window.addEventListener("hashchange", iniciar);
iniciar();
</script></body></html>
