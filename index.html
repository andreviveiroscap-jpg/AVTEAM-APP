:root[data-theme="dark"]{color-scheme:dark;--bg:#150b26;--card:#20123a;--ink:#ece7f7;--mute:#a89fc0;--line:#36264f;--acc:#a78bff;--on:#150b26;--ok:#4cd6a0;--okbg:#14382d;--band:#2f0f5a}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 14px 120px}

.row input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chk{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;font-size:20px;font-weight:700}
.row.done .chk{background:var(--ok);border-color:var(--ok);color:var(--on)}

#fin{background:var(--acc);color:var(--on)}
#wpp{background:transparent;color:var(--acc)}
.toast{position:fixed;left:14px;right:14px;bottom:84px;margin:auto;max-width:520px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:15px}
.toast[hidden]{display:none}
.info{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:0 14px;margin:14px 0 0}
.info summary{font:400 22px "Bebas Neue",sans-serif;letter-spacing:.02em;padding:12px 0;cursor:pointer}
.info summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.info[open] summary{border-bottom:1px solid var(--line)}
.info ul{margin:10px 0;padding-left:18px}
.info li{margin:0 0 8px;font-size:15px}
.info h3{font:400 20px "Bebas Neue",sans-serif;letter-spacing:.02em;margin:14px 0 6px}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 12px;font-size:15px}
.info dt{font-weight:600}
.info dd{margin:0}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}

.lnk{background:none;border:0;color:var(--acc);font:600 14px Barlow,sans-serif;padding:0 0 10px;cursor:pointer}
.fl{display:block;font-size:13px;color:var(--mute);margin:0 0 12px}
.fl input,.fl textarea,.f{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:500 15px Barlow,sans-serif;padding:9px 10px}
.f{margin-top:0}
.fl input:focus-visible,.fl textarea:focus-visible,.f:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.acts button,.sm{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:10px;padding:8px 12px;font:600 14px Barlow,sans-serif;cursor:pointer}
.acts .pri{background:var(--acc);color:var(--on)}
.acts .dan,.dan{color:#b3261e;border-color:#b3261e}
.big{width:100%;height:46px;border-radius:12px;border:1px dashed var(--acc);background:transparent;color:var(--acc);font:700 16px Barlow,sans-serif;margin:4px 0 12px;cursor:pointer}
.erow{display:grid;grid-template-columns:1fr 52px 62px 38px;gap:6px;margin-bottom:10px}
.erow .nm{grid-column:1/-1}
.sm{padding:0;height:40px}
#pub{background:var(--acc);color:var(--on)}
#pub:disabled{opacity:.45}
#volta{background:transparent;color:var(--acc)}

  W.ex.forEach(function(e, i){ $("ev" + i).textContent = fmtS(tonn([cur[i]])); });
  $("grp").innerHTML = grpTxt().map(function(s){ return "<span>" + esc(s) + "</span>"; }).join("");
}

function viewPainel(){
  A = null; W = null;
  app.innerHTML = topBar("Painel do treinador", "Meus alunos") + '<main>' +
    '<label class="fl">Link do app<input data-f="base" value="' + esc(D.base) + '"></label>' +
    '<label class="fl">Seu WhatsApp, com DDI (ex.: 5521999999999)<input data-f="fone" inputmode="numeric" value="' + esc(D.fone) + '"></label>' +
    D.alunos.map(function(a){ return '<section class="ex"><h2>' + esc(a.nome) + '</h2><p class="meta">' + a.treinos.length + ' treino(s) · código #' + a.id + '</p><div class="acts"><button class="pri" data-act="ver" data-id="' + a.id + '">Ver como aluno</button><button data-act="edit" data-id="' + a.id + '">Editar</button><button data-act="copy" data-id="' + a.id + '">Copiar link</button></div></section>'; }).join("") +
    '<button class="big" data-act="novo">+ Novo aluno</button>' +
    '<label class="fl">Link do aluno<input id="lk" readonly placeholder="Toque em Copiar link"></label></main>' +
    '<div class="bar"><button id="pub" data-act="pub" type="button"' + (DIRTY ? "" : " disabled") + '>Publicar alterações</button></div>';
}
function viewEditor(){
  var a = EDIT;
  app.innerHTML = topBar("Editando aluno", esc(a.nome || "Novo aluno")) + '<main>' +
    '<label class="fl">Nome do aluno<input data-f="nome" value="' + esc(a.nome) + '"></label>' +
    '<label class="fl">Orientações (uma por linha; **texto** deixa em negrito)<textarea data-f="orient" rows="9">' + esc(a.orient) + '</textarea></label>' +
    a.treinos.map(function(t, ti){
      return '<section class="ex"><label class="fl">Dia<input data-f="dia" data-ti="' + ti + '" value="' + esc(t.dia) + '"></label><label class="fl">Nome do treino<input data-f="tn" data-ti="' + ti + '" value="' + esc(t.nome) + '"></label>' +
        t.ex.map(function(e, ei){ var at = ' data-ti="' + ti + '" data-ei="' + ei + '"'; return '<div class="erow"><input class="f nm" placeholder="Exercício" data-f="en"' + at + ' value="' + esc(e.n) + '"><input class="f" placeholder="Grupo" data-f="eg"' + at + ' value="' + esc(e.g) + '"><input class="f" inputmode="numeric" placeholder="Sér." data-f="es"' + at + ' value="' + esc(e.s) + '"><input class="f" placeholder="Reps" data-f="er"' + at + ' value="' + esc(e.r) + '"><button class="sm" type="button" data-act="dele"' + at + ' aria-label="Remover exercício">✕</button></div>'; }).join("") +
        '<div class="acts"><button data-act="adde" data-ti="' + ti + '">+ Exercício</button><button class="dan" data-act="delt" data-ti="' + ti + '">Remover treino</button></div></section>';
    }).join("") +
    '<button class="big" data-act="addt">+ Treino</button><div class="acts"><button class="dan" data-act="dela">Excluir aluno</button></div></main>' +
    '<div class="bar"><button id="volta" data-act="volta" type="button">Voltar</button><button id="pub" data-act="pub" type="button"' + (DIRTY ? "" : " disabled") + '>Publicar alterações</button></div>';
}
function redraw(){ var y = window.scrollY; DIRTY = true; viewEditor(); window.scrollTo(0, y); }
function armed(b, txt){ if (b.dataset.armed) return true; b.dataset.armed = "1"; b.dataset.old = b.textContent; b.textContent = txt; setTimeout(function(){ if (b.isConnected) { delete b.dataset.armed; b.textContent = b.dataset.old; } }, 3000); return false; }
function find(id){ return D.alunos.filter(function(a){ return a.id === id; })[0]; }

function buildHtml(){
  var head = Array.prototype.map.call(document.head.querySelectorAll("[data-k]"), function(n){ return n.outerHTML; }).join("\n");
  var json = JSON.stringify(D).replace(/</g, "\\u003c");
  return "<!doctype html>\n<html lang=\"pt-BR\"><head>" + head + "<style id=\"css\">" + $("css").textContent + "</style></head><body><div id=\"app\"></div><div class=\"toast\" id=\"toast\" hidden></div><script id=\"dados\" type=\"application/json\">" + json + "</" + "script><script id=\"js\">" + $("js").textContent + "</" + "script></body></html>";
}
async function publicar(){
  try {
    var art = await window.claude.use("artifact");
    if (!art) { toast("Publicar não está disponível aqui. Abra o app pelo seu perfil."); return; }
    await art.publish(buildHtml());
    DIRTY = false; toast("Alterações publicadas.");
  } catch (e) { toast("Não foi possível publicar" + (e && e.code ? " (" + e.code + ")" : "") + "."); }
}

function onInput(ev){
  var t = ev.target, r = t.closest(".row");
  if (r && W) { var x = sets(+r.dataset.i)[+r.dataset.j]; if (t.classList.contains("kg")) x.kg = t.value.replace(",", "."); else if (t.classList.contains("rp")) x.reps = t.value; save(); progress(); return; }
  var f = t.dataset.f; if (!f) return;
  var T = EDIT && EDIT.treinos[+t.dataset.ti], E = T && T.ex[+t.dataset.ei], v = t.value;
  if (f === "base") D.base = v; else if (f === "fone") D.fone = v.replace(/\D/g, "");
  else if (f === "nome") EDIT.nome = v; else if (f === "orient") EDIT.orient = v;
  else if (f === "dia") T.dia = v; else if (f === "tn") T.nome = v;
  else if (f === "en") E.n = v; else if (f === "eg") E.g = v; else if (f === "er") E.r = v;
  else if (f === "es") E.s = Math.max(1, Math.min(10, parseInt(v, 10) || 1));
  DIRTY = true; var p = $("pub"); if (p) p.disabled = false;
}
function onClick(ev){
  var b = ev.target.closest("button"); if (!b) return;
  var a = b.dataset.act, id = b.id, ti = +b.dataset.ti, ei = +b.dataset.ei;
  if (b.classList.contains("chk")) { var r = b.closest(".row"), x = sets(+r.dataset.i)[+r.dataset.j]; x.done = !x.done; r.classList.toggle("done", x.done); save(); progress(); return; }
  if (b.dataset.w) { W = A.treinos.filter(function(w){ return w.id === b.dataset.w; })[0]; viewAluno(); return; }
  if (id === "back") { viewPainel(); return; }
  if (id === "fin" && W) {
    S.last[W.id] = W.ex.map(function(e, i){ return sets(i).map(function(x){ return {kg:x.kg, reps:x.reps}; }); });
    S.cur[W.id] = []; save(); viewAluno(); window.scrollTo(0, 0);
    toast("Treino salvo neste aparelho. Na próxima vez, suas cargas aparecem em “Última vez”."); return;
  }
  if (id === "wpp" && W) {
    var txt = "Treino de " + W.dia + " (" + W.nome + ") – " + A.nome + "\n";
    W.ex.forEach(function(e, i){ var l = sets(i).map(function(x, j){ return x.kg ? (j + 1) + ") " + x.kg + " kg × " + (x.reps || "?") : null; }).filter(Boolean); txt += "\n" + e.n + ": " + (l.length ? l.join(" | ") : "não feito"); });
    txt += "\n\nVolume total: " + fmt(tonn(W.ex.map(function(e, i){ return sets(i); }))) + "\n" + grpTxt().join(" | ");
    var url = "https://wa.me/" + (D.fone || "") + "?text=" + encodeURIComponent(txt), w = null;
    try { w = window.open(url, "_blank"); } catch (e) {}
    try { navigator.clipboard.writeText(txt); } catch (e) {}
    var prev = $("envio"); if (prev) prev.remove();
    var box = document.createElement("div"); box.id = "envio"; box.className = "envio";
    box.innerHTML = '<p>' + (w ? "Se o WhatsApp não abriu, use as opções abaixo." : "O WhatsApp não abriu sozinho. Toque no botão abaixo ou copie o resumo e cole na conversa com o treinador.") + '</p><textarea readonly rows="6">' + esc(txt) + '</textarea><div class="acts"><a class="lnkbtn" href="' + url + '" target="_blank" rel="noopener">Abrir WhatsApp</a><button type="button" data-act="copyres">Copiar resumo</button></div>';
    document.querySelector("main").appendChild(box); box.scrollIntoView({block:"center"}); return;
  }
  if (!a) return;
  if (a === "coach") { OWNER = true; viewPainel(); }
  else if (a === "copyres") { var ta = document.querySelector("#envio textarea"); ta.select(); try { navigator.clipboard.writeText(ta.value).then(function(){ toast("Resumo copiado. Cole no WhatsApp."); }, function(){ toast("Selecione o texto e copie."); }); } catch (e) { toast("Selecione o texto e copie."); } }
  else if (a === "pub") publicar();
  else if (a === "ver") { A = find(b.dataset.id); load(); W = A.treinos[0] || null; viewAluno(); window.scrollTo(0, 0); }
  else if (a === "edit") { EDIT = find(b.dataset.id); viewEditor(); window.scrollTo(0, 0); }
  else if (a === "copy") {
    var link = (D.base || "").replace(/#.*$/, "") + "#" + b.dataset.id, lk = $("lk"); lk.value = link; lk.select();
    try { navigator.clipboard.writeText(link).then(function(){ toast("Link copiado."); }, function(){ toast("Copie o link no campo abaixo."); }); } catch (e) { toast("Copie o link no campo abaixo."); }
  }
  else if (a === "novo") { EDIT = {id:uid(), nome:"Novo aluno", orient:DEF, treinos:[{id:"t" + uid(), dia:"Segunda", nome:"Treino A", ex:[]}]}; D.alunos.push(EDIT); DIRTY = true; viewEditor(); window.scrollTo(0, 0); }
  else if (a === "volta") { EDIT = null; viewPainel(); window.scrollTo(0, 0); }
  else if (a === "adde") { EDIT.treinos[ti].ex.push({n:"", g:"", s:3, r:"6–10"}); redraw(); }
  else if (a === "dele") { EDIT.treinos[ti].ex.splice(ei, 1); redraw(); }
  else if (a === "addt") { EDIT.treinos.push({id:"t" + uid(), dia:"Dia", nome:"Novo treino", ex:[]}); redraw(); }
  else if (a === "delt") { if (armed(b, "Toque de novo para remover")) { EDIT.treinos.splice(ti, 1); redraw(); } }
  else if (a === "dela") { if (armed(b, "Toque de novo para excluir")) { D.alunos.splice(D.alunos.indexOf(EDIT), 1); EDIT = null; DIRTY = true; viewPainel(); window.scrollTo(0, 0); } }
}
app.addEventListener("click", onClick);
app.addEventListener("input", onInput);
function route(){
  var h = location.hash.replace("#", ""); if (h === "treinador") OWNER = true; A = find(h) || null;
  if (A) { load(); W = A.treinos[0] || null; viewAluno(); } else if (OWNER) viewPainel(); else viewBloqueio();
}
route();
try { window.claude.use("user").then(function(u){ if (u && u.isOwner() && !OWNER) { OWNER = true; route(); } }); } catch (e) {}
